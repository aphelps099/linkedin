<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" fill="none" role="img" aria-labelledby="droid-title droid-description">
  <title id="droid-title">LinkedIn Beats office droid</title>
  <desc id="droid-description">A small, squat cream office robot with a silver dome, offset black visor, cobalt blue collar and two small wheels. Transparent background. Editable vector groups for the wheels, chassis, blue collar, dome, visor and surface details.</desc>
  <defs>
    <linearGradient id="cream-body" x1="141" y1="314" x2="686" y2="443" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9d7c8"/>
      <stop offset=".26" stop-color="#f0eee1"/>
      <stop offset=".67" stop-color="#e5e1d1"/>
      <stop offset="1" stop-color="#bcbcac"/>
    </linearGradient>
    <linearGradient id="cream-dome" x1="264" y1="114" x2="498" y2="309" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbf8e9"/>
      <stop offset=".48" stop-color="#e7e4d3"/>
      <stop offset="1" stop-color="#c7c8b9"/>
    </linearGradient>
    <radialGradient id="silver-dome" cx=".39" cy=".16" r=".9" gradientTransform="translate(.07 -.03) scale(.95 1.12)">
      <stop stop-color="#ffffff"/>
      <stop offset=".24" stop-color="#e8ebeb"/>
      <stop offset=".5" stop-color="#bfc5c8"/>
      <stop offset=".77" stop-color="#8e999f"/>
      <stop offset="1" stop-color="#d5d8d5"/>
    </radialGradient>
    <linearGradient id="collar-blue" x1="385" y1="278" x2="385" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c9bea"/>
      <stop offset=".32" stop-color="#0c6ad3"/>
      <stop offset="1" stop-color="#03499f"/>
    </linearGradient>
    <linearGradient id="dark-rubber" x1="390" y1="432" x2="390" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41474b"/>
      <stop offset="1" stop-color="#111c24"/>
    </linearGradient>
    <linearGradient id="visor-glass" x1="573" y1="185" x2="613" y2="263" gradientUnits="userSpaceOnUse">
      <stop stop-color="#374047"/>
      <stop offset=".37" stop-color="#151f27"/>
      <stop offset="1" stop-color="#080f16"/>
    </linearGradient>
    <linearGradient id="blue-panel" x1="604" y1="364" x2="636" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1477dc"/>
      <stop offset="1" stop-color="#084eac"/>
    </linearGradient>
    <linearGradient id="metal-rim" x1="558" y1="188" x2="605" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8faf7"/>
      <stop offset=".45" stop-color="#7b8589"/>
      <stop offset="1" stop-color="#e8eae2"/>
    </linearGradient>
  </defs>

